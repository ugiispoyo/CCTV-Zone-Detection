[project]
name = "cctv-zone-cv"
version = "0.1.0"
description = "Multi-class CCTV zone detection service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aio-pika>=9.5,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "numpy>=2.0,<3",
  "prometheus-client>=0.21,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "structlog>=24.4,<27",
  "tenacity>=9,<10",
  "ultralytics>=8.3,<9",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]

[project.scripts]
cctv-cv = "cctv_cv.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cctv_cv"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

